<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B1E">
<title>Lane — Weight Loss Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lane">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">LANE</span>
    </div>
    <button id="btn-export" class="icon-btn" title="Backup / restore data" aria-label="Backup or restore data">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <main id="view-root" class="view-root"></main>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn" data-tab="home" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4l8 7.5M6 10v9a1 1 0 001 1h10a1 1 0 001-1v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-tab="workout" aria-label="Workout">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6.5 6.5l11 11M4 9l3-3 2 2-3 3-2-2zm9 9l3-3 2 2-3 3-2-2zM2.5 7.5l2-2M19.5 18.5l2-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Workout</span>
    </button>
    <button class="nav-btn" data-tab="weight" aria-label="Weight">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="2"/><path d="M12 13l3-3M9 3h6M12 3v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Weight</span>
    </button>
    <button class="nav-btn" data-tab="steps" aria-label="Steps">
      <svg viewBox="0 0 24 24" fill="none"><path d="M8 4c1.2 0 2 1 2 2.2C10 7.6 8.8 9 8 9s-1.6-1-1.6-2.4C6.4 5 7.2 4 8 4zM4.5 12c1 0 1.8.9 1.8 2.4S5.6 18 4.6 18c-1 0-1.9-1-1.9-2.6S3.7 12 4.5 12z" fill="currentColor"/><path d="M16 12c1.2 0 2 1 2 2.2 0 1.4-1.2 2.8-2 2.8s-1.6-1-1.6-2.4c0-1.6.8-2.6 1.6-2.6zM19.5 4c1 0 1.8.9 1.8 2.4S20.6 10 19.6 10c-1 0-1.9-1-1.9-2.6S18.7 4 19.5 4z" fill="currentColor"/></svg>
      <span>Steps</span>
    </button>
    <button class="nav-btn" data-tab="config" aria-label="Config">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Config</span>
    </button>
  </nav>

</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/timer.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/workout.js"></script>
<script src="js/views/weight.js"></script>
<script src="js/views/steps.js"></script>
<script src="js/views/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
